services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Definir DB_NAME}
      MYSQL_USER: ${DB_USER:?Definir DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - catalog-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  catalog:
    build: .
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?Definir DB_NAME}
      DB_USER: ${DB_USER:?Definir DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
      APP_PORT: 8080
      CATEDRA_BASE_URL: ${CATEDRA_BASE_URL:?Definir CATEDRA_BASE_URL}
      CATEDRA_USERNAME: ${CATEDRA_USERNAME:?Definir CATEDRA_USERNAME}
      CATEDRA_PASSWORD: ${CATEDRA_PASSWORD:?Definir CATEDRA_PASSWORD}
      CATEDRA_GROUP_ID: ${CATEDRA_GROUP_ID:?Definir CATEDRA_GROUP_ID}
      JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      API_DOCS_ENABLED:
      # Ausentes se omiten; los valores predeterminados están en application.yaml.
      CATALOG_INTEGRATION_MAX_ATTEMPTS:
      CATALOG_INTEGRATION_RETRY_DELAY_MS:
      CATALOG_INTEGRATION_CONNECT_TIMEOUT_MS:
      CATALOG_INTEGRATION_READ_TIMEOUT_MS:
      CATALOG_INTEGRATION_REQUEST_TIMEOUT_MS:
      CATALOG_SNAPSHOT_MAX_ATTEMPTS:
      CATALOG_SNAPSHOT_RETRY_DELAY_MS:
      CATALOG_SNAPSHOT_CONNECT_TIMEOUT_MS:
      CATALOG_SNAPSHOT_READ_TIMEOUT_MS:
      CATALOG_SNAPSHOT_REQUEST_TIMEOUT_MS:
      CATALOG_INCREMENTAL_MAX_ATTEMPTS:
      CATALOG_INCREMENTAL_RETRY_DELAY_MS:
      CATALOG_INCREMENTAL_RETRY_COOLDOWN_MS:
      CATALOG_RECOVERY_MAX_CYCLES:
      CATALOG_RECOVERY_CYCLE_DELAY_MS:
      CATALOG_RECOVERY_BLOCK_DELAY_MS:
      CATALOG_REDIS_CONNECT_TIMEOUT_MS:
      CATALOG_REDIS_COMMAND_TIMEOUT_MS:
      CATALOG_REDIS_READ_TIMEOUT_MS:
      CATALOG_KAFKA_TIMEOUT_MS:
      CATALOG_MONITOR_INTERVAL_MS:
    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEY_PATH:?Definir JWT_PUBLIC_KEY_PATH}
        target: /run/keys/public.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    networks:
      - default
      - services
    depends_on:
      mysql:
        condition: service_healthy

networks:
  default: {}
  services:
    name: prog2-services
    external: true

volumes:
  catalog-mysql-data:
