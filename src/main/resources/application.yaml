spring:
  # Los parámetros centrales llegan después del login; no construir clientes localhost.
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  application:
    name: catalog
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?connectTimeout=5000&socketTimeout=10000
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
      initialization-fail-timeout: 1
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # LocalTime conserva la hora de atención sin pasar por java.sql.Time ni cambiar de zona.
          java_time_use_direct_jdbc: true
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    connect-retries: 0

catalog:
  operational:
    integration:
      max-attempts: ${CATALOG_INTEGRATION_MAX_ATTEMPTS:3}
      retry-delay-ms: ${CATALOG_INTEGRATION_RETRY_DELAY_MS:5000}
      connect-timeout-ms: ${CATALOG_INTEGRATION_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${CATALOG_INTEGRATION_READ_TIMEOUT_MS:5000}
      request-timeout-ms: ${CATALOG_INTEGRATION_REQUEST_TIMEOUT_MS:10000}
    snapshot:
      max-attempts: ${CATALOG_SNAPSHOT_MAX_ATTEMPTS:3}
      retry-delay-ms: ${CATALOG_SNAPSHOT_RETRY_DELAY_MS:5000}
      connect-timeout-ms: ${CATALOG_SNAPSHOT_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${CATALOG_SNAPSHOT_READ_TIMEOUT_MS:10000}
      request-timeout-ms: ${CATALOG_SNAPSHOT_REQUEST_TIMEOUT_MS:20000}
    incremental:
      max-attempts: ${CATALOG_INCREMENTAL_MAX_ATTEMPTS:3}
      retry-delay-ms: ${CATALOG_INCREMENTAL_RETRY_DELAY_MS:5000}
      retry-cooldown-ms: ${CATALOG_INCREMENTAL_RETRY_COOLDOWN_MS:30000}
    recovery:
      max-cycles: ${CATALOG_RECOVERY_MAX_CYCLES:3}
      cycle-delay-ms: ${CATALOG_RECOVERY_CYCLE_DELAY_MS:30000}
      block-delay-ms: ${CATALOG_RECOVERY_BLOCK_DELAY_MS:300000}
    redis:
      connect-timeout-ms: ${CATALOG_REDIS_CONNECT_TIMEOUT_MS:5000}
      command-timeout-ms: ${CATALOG_REDIS_COMMAND_TIMEOUT_MS:5000}
      read-timeout-ms: ${CATALOG_REDIS_READ_TIMEOUT_MS:20000}
    kafka:
      timeout-ms: ${CATALOG_KAFKA_TIMEOUT_MS:10000}
    monitor:
      interval-ms: ${CATALOG_MONITOR_INTERVAL_MS:30000}

server:
  port: ${APP_PORT:8080}

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: false
      show-details: never
      show-components: never
